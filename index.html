<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>My Music</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 420px;
      width: 100%;
      text-align: center;
      background-color: #1e1e1e;
      border: 1px solid #2d2d2d;
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 16px;
      color: #ffffff;
      font-weight: 600;
    }
    .message {
      font-size: 1rem;
      line-height: 1.5;
      color: #b3b3b3;
      margin-bottom: 24px;
      word-break: break-word;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px 20px;
      background-color: #1db954;
      color: #000000;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      margin-bottom: 20px;
    }
    .btn:hover, .btn:focus {
      background-color: #1ed760;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .secondary-link {
      display: inline-block;
      font-size: 0.9rem;
      color: #888888;
      text-decoration: none;
      transition: color 0.2s ease;
      margin-top: 8px;
    }
    .secondary-link:hover {
      color: #ffffff;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>My Music</h1>
    <p id="status-message" class="message">Finding your music server...</p>
    <button id="retry-btn" class="btn" style="display: none;">Retry</button>
    <div>
      <a href="http://100.71.205.20:8081/" class="secondary-link">Open over Tailscale</a>
    </div>
  </div>

  <script>
    (function() {
      const TUNNEL_REGEX = /^https:\/\/[a-z0-9-]{3,63}\.trycloudflare\.com\/?$/;
      const statusEl = document.getElementById('status-message');
      const retryBtn = document.getElementById('retry-btn');

      function setStatus(msg) {
        statusEl.textContent = msg;
      }

      function showRetry() {
        retryBtn.style.display = 'inline-block';
      }

      function hideRetry() {
        retryBtn.style.display = 'none';
      }

      async function probeHealth(url, timeoutMs) {
        try {
          const probeTarget = url.replace(/\/$/, '') + '/healthz';
          const controller = new AbortController();
          const timeoutId = setTimeout(function() { controller.abort(); }, timeoutMs || 2000);
          const probeRes = await fetch(probeTarget, { signal: controller.signal });
          clearTimeout(timeoutId);
          return probeRes.ok;
        } catch (e) {
          return false;
        }
      }

      async function resolveAndRedirect() {
        hideRetry();

        const hash = window.location.hash ? window.location.hash.substring(1).trim() : '';
        if (!hash) {
          setStatus('Open this page from your bookmark');
          return;
        }

        setStatus('Finding your music server...');

        // 1. Fast-path: probe last known working tunnel from localStorage
        let cachedUrl = null;
        try {
          cachedUrl = localStorage.getItem('last_tunnel_url');
        } catch (e) {}

        if (cachedUrl && TUNNEL_REGEX.test(cachedUrl)) {
          const isHealthy = await probeHealth(cachedUrl, 2000);
          if (isHealthy) {
            window.location.replace(cachedUrl);
            return;
          }
        }

        // 2. Fetch fresh tunnel from ntfy topic
        const topicUrl = 'https://ntfy.sh/' + encodeURIComponent(hash) + '/json?poll=1&since=12h';

        try {
          const res = await fetch(topicUrl);
          if (!res.ok) {
            setStatus('Your music server looks offline. Try again in a minute.');
            showRetry();
            return;
          }

          const text = await res.text();
          const lines = text.trim().split('\n');
          let newestMsg = null;
          let newestTime = 0;

          for (let i = 0; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line) continue;
            try {
              const data = JSON.parse(line);
              if (data && data.event === 'message' && typeof data.message === 'string') {
                newestMsg = data.message.trim();
                newestTime = Number(data.time) || 0;
              }
            } catch (e) {
              // skip non-json line
            }
          }

          if (!newestMsg) {
            setStatus('Your music server looks offline. Try again in a minute.');
            showRetry();
            return;
          }

          // If the latest heartbeat is older than 60 minutes, server is likely offline
          const nowSec = Math.floor(Date.now() / 1000);
          if (newestTime > 0 && (nowSec - newestTime) > 3600) {
            setStatus('Your music server looks offline. Try again in a minute.');
            showRetry();
            return;
          }

          if (TUNNEL_REGEX.test(newestMsg)) {
            setStatus('Connecting to your music server...');
            const isHealthy = await probeHealth(newestMsg, 3500);
            if (isHealthy) {
              try {
                localStorage.setItem('last_tunnel_url', newestMsg);
              } catch (e) {}
              window.location.replace(newestMsg);
              return;
            }
            setStatus('Your music server is reconnecting. Try again in a minute.');
            showRetry();
          } else {
            setStatus('Server link not found');
          }
        } catch (err) {
          setStatus('Your music server looks offline. Try again in a minute.');
          showRetry();
        }
      }

      retryBtn.addEventListener('click', resolveAndRedirect);
      window.addEventListener('hashchange', resolveAndRedirect);

      resolveAndRedirect();
    })();
  </script>
</body>
</html>
